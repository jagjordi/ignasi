    Research Experience:
      - company: University of Aberdeen
        position: Independent Doctoral Researcher
        location: Aberdeen, United Kingdom
        start_date: 2021
        end_date: 2025
        summary: "Supervisor: Dr Jonathan Hicks."
        highlights:
          - Designed and executed a multi-year empirical research programme on tempo, performance time and portamento in Beethoven's five piano and cello sonatas — from research questions through methodology, data collection, analysis and writing.
          - Assembled, digitised and annotated a corpus of over 100 commercial and archival recordings spanning 1930–2012 (Casals, Feuermann, Fournier, Piatigorsky, du Pré, Rostropovich, Shafran, Starker, Tortelier, Ma, Wispelwey, Bylsma, Maisky, Perényi, Kliegel, Isserlis and others).
          - Developed an original manual bar-by-bar tempo-measurement protocol, characterised to millisecond resolution, after documenting the failure of automated beat-detection tools on polyphonic duo recordings.
          - Implemented k-means clustering (scikit-learn, k-means++, 100 restarts) identifying three coexisting tempo traditions stable across eight decades; developed a spline-CDF smoothing method for histogram density estimation.
          - Produced a five-tool visualisation suite (tempographs, histograms, ridgeline plots, stacked bar charts, combination charts) in Python and MATLAB, openly published on GitHub.

      - company: KTH Royal Institute of Technology
        position: Cross-Disciplinary Collaboration
        location: Stockholm, Sweden
        start_date: 2021
        end_date: 2025
        highlights:
          - Collaborated with an engineer (VLSI design) on the mathematical framework, error model and data architecture of the tempo-measurement protocol.
          - Built an open-access reproducible research pipeline in Python (pandas, numpy, scipy, matplotlib, seaborn, scikit-learn) and MATLAB.

    Teaching Experience:
      - company: Notting Hill and Ealing High School (GDST)
        position: Director of Music, Junior Department
        location: London, United Kingdom
        start_date: 2022-09
        end_date: Present
        highlights:
          - Design and deliver a research-informed seven-year music curriculum for 300+ students (Reception–Year 6), integrating performance, analysis, composition and music technology.
          - Lead and mentor a team of 15+ visiting instrumental teachers; manage budget, resource planning, safeguarding and assessment.
          - Grew the instrumental programme to 134 students across 12+ instruments; achieved a 60% Distinction/Merit rate in ABRSM exams via an in-house low-stakes assessment model.
          - Established a partnership with the Royal Opera House "Create and Dance" programme; directed performances at the Royal Albert Hall and Cadogan Hall.
          - Mentor pre-university students preparing Oxbridge and conservatoire applications.

      - company: St James Prep & The Falcons Pre-Prep School
        position: Head of Music (concurrent roles)
        location: London, United Kingdom
        start_date: 2020-09
        end_date: 2022-08
        highlights:
          - Led music provision across two independent schools (EYFS, KS1, KS2); redesigned the Prep curriculum around data-driven assessment.
          - Reduced departmental expenditure at The Falcons by 50% over three years while maintaining quality of provision.

      - company: Sistema Scotland & University of Aberdeen
        position: Senior Music Educator, Strings Lead & Director of Orchestral Music
        location: Aberdeen, United Kingdom
        start_date: 2017-08
        end_date: 2020-08
        highlights:
          - Delivered the Big Noise El Sistema programme to 600+ children weekly (Early Years–Year 9), with strings and vocal pedagogy rooted in ensemble work and social inclusion.
          - Directed the University of Aberdeen Symphony and Chamber Orchestras; mentored undergraduate music-education placements.

