  image: ""
  summary: >
    Musicologist working at the intersection of empirical performance studies, music historiography
    and music education. Doctoral research on tempo, performance time and portamento in Beethoven's
    piano and cello sonatas has yielded five preprints (2025–2026), a 346-page thesis, and an open
    dataset and analysis code in Python and MATLAB. Ph.D. self-funded through over five years of
    senior music leadership in UK independent schools.

